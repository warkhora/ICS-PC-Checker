<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Power Consumption — PCFORGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>

<div class="pf-container">

  <header class="pf-hero">
    <div class="pf-eyebrow">● Watts &amp; kroner</div>
    <h1>Power Consumption</h1>
    <p>What the system actually pulls from the wall, whether your power supply is the right
       size, and what a year of gaming costs at your electricity price.</p>
  </header>

  <section class="pf-card pf-card-hover reveal">
    <h2><span class="ico">⚡</span> System &amp; usage</h2>
    <div class="pf-grid pf-grid-2">
      <div><label class="pf-label" for="cpu">CPU</label><select id="cpu"></select></div>
      <div><label class="pf-label" for="gpu">GPU</label><select id="gpu"></select></div>
    </div>
    <div class="pf-grid pf-grid-3" style="margin-top:14px;">
      <div><label class="pf-label" for="psu">Power supply</label><select id="psu"></select></div>
      <div><label class="pf-label" for="efficiency">PSU efficiency</label>
        <select id="efficiency">
          <option value="0.82">80+ Bronze (82%)</option>
          <option value="0.87" selected>80+ Gold (87%)</option>
          <option value="0.90">80+ Platinum (90%)</option>
          <option value="0.92">80+ Titanium (92%)</option>
        </select>
      </div>
      <div><label class="pf-label" for="intensity">Workload</label>
        <select id="intensity">
          <option value="idle">Desktop / idle</option>
          <option value="gaming" selected>Gaming</option>
          <option value="cpuheavy">CPU-heavy (render / compile)</option>
          <option value="gpuheavy">GPU-heavy (path tracing, ML)</option>
        </select>
      </div>
    </div>
    <div class="pf-grid pf-grid-3" style="margin-top:14px;">
      <div><label class="pf-label" for="price">Electricity price (per kWh)</label><input type="number" id="price" value="0.25" step="0.01" min="0"></div>
      <div><label class="pf-label" for="hours">Hours per day</label><input type="number" id="hours" value="3" step="0.5" min="0"></div>
      <div><label class="pf-label" for="extras">System extras</label>
        <select id="extras">
          <option value="40">Minimal — few fans, one drive</option>
          <option value="65" selected>Typical gaming PC</option>
          <option value="95">Heavy — many fans, RGB, several drives</option>
        </select>
      </div>
    </div>
    <button class="pf-btn" id="run">Estimate power draw</button>
  </section>

  <section class="pf-card reveal">
    <h2><span class="ico">🔌</span> Results</h2>
    <div class="pf-grid pf-grid-4" id="stats"></div>
    <div class="pf-section-title">PSU loading</div>
    <div id="psuBar"></div>
    <div class="pf-note" id="psuNote"></div>
    <div class="pf-section-title">Where the watts go</div>
    <div id="chart"></div>
    <div class="pf-section-title">Cost over time</div>
    <div class="pf-scroll"><table class="pf-table" id="costs"></table></div>
    <div class="pf-summary" id="summary"></div>
  </section>

</div>

<script src="assets/data.js"></script>
<script src="assets/engine.js"></script>
<script>
const S = { cpu: "9800x3d", gpu: "rtx5070", psu: 750, eff: 0.87, intensity: "gaming", price: 0.25, hours: 3, extras: 65 };

fillSelect(document.getElementById("cpu"), CPUS.filter(c => !c.integrated), { groupKey: "brand", value: S.cpu });
fillSelect(document.getElementById("gpu"), GPUS, { groupKey: "brand", value: S.gpu, labelFn: g => `${g.name} — ${g.tdp} W` });
fillSelect(document.getElementById("psu"), PSUS.map(w => ({ id: w, name: w + " W" })), { value: 750 });

const LOAD = {
  idle:     { cpu: 0.12, gpu: 0.08, cpuFloor: 18, gpuFloor: 12 },
  gaming:   { cpu: 0.55, gpu: 0.95, cpuFloor: 0,  gpuFloor: 0 },
  cpuheavy: { cpu: 1.00, gpu: 0.12, cpuFloor: 0,  gpuFloor: 0 },
  gpuheavy: { cpu: 0.35, gpu: 1.00, cpuFloor: 0,  gpuFloor: 0 }
};

function estimatePower() {
  const cpu = cpuById(S.cpu), gpu = gpuById(S.gpu);
  const l = LOAD[S.intensity];
  const cpuW = Math.max(l.cpuFloor, Math.round(cpu.ppt * l.cpu));
  const gpuW = Math.max(l.gpuFloor, Math.round(gpu.tdp * l.gpu));
  const dcW = cpuW + gpuW + S.extras;
  const wallW = Math.round(dcW / S.eff);
  const lostW = wallW - dcW;
  const loadPct = wallW / S.psu * 100;
  const transient = Math.round(dcW + (gpu.tdp >= 300 ? gpu.tdp * 0.8 : gpu.tdp * 0.35));
  /* Anchor to vendor guidance (roughly 1.9× the GPU's TGP plus the CPU package),
     and never go below 1.35× the measured load. */
  const recommended = Math.max(
    Math.ceil((gpu.tdp * 1.9 + (cpu.ppt || cpu.tdp)) / 50) * 50,
    Math.ceil(dcW * 1.35 / 50) * 50
  );

  document.getElementById("stats").innerHTML = `
    <div class="pf-stat"><div class="pf-stat-label">Component draw (DC)</div>
      <div class="pf-stat-value">${fmt(dcW)}<small> W</small></div>
      <div class="pf-stat-note">CPU ${cpuW} W + GPU ${gpuW} W + ${S.extras} W system</div></div>
    <div class="pf-stat"><div class="pf-stat-label">From the wall</div>
      <div class="pf-stat-value c-gold">${fmt(wallW)}<small> W</small></div>
      <div class="pf-stat-note">${Math.round(S.eff * 100)}% efficient — ${lostW} W becomes heat</div></div>
    <div class="pf-stat"><div class="pf-stat-label">Transient peak</div>
      <div class="pf-stat-value ${transient > S.psu ? "c-red" : ""}">≈${fmt(transient)}<small> W</small></div>
      <div class="pf-stat-note">Sub-millisecond GPU power spikes</div></div>
    <div class="pf-stat"><div class="pf-stat-label">Yearly cost</div>
      <div class="pf-stat-value c-green">${(wallW / 1000 * S.hours * 365 * S.price).toFixed(0)}<small> /year</small></div>
      <div class="pf-stat-note">${S.hours} h/day at ${S.price}/kWh</div></div>`;

  const tone = loadPct > 100 ? "red" : loadPct > 85 ? "" : loadPct > 70 ? "" : "green";
  document.getElementById("psuBar").innerHTML = `
    <div class="pf-stat">
      <div class="pf-stat-label">Sustained load on the ${S.psu} W supply</div>
      <div class="pf-stat-value ${loadPct > 100 ? "c-red" : loadPct > 85 ? "c-orange" : "c-green"}">${loadPct.toFixed(0)}<small>%</small></div>
      <div class="pf-bar ${tone}"><i style="width:${clamp(loadPct, 0, 100)}%"></i></div>
      <div class="pf-stat-note">Efficiency peaks between 40% and 70% load. Below 20% or above 90% you are throwing money away as heat.</div>
    </div>`;

  document.getElementById("psuNote").className = "pf-note " + (loadPct > 100 ? "red" : loadPct > 85 || transient > S.psu ? "" : "green");
  document.getElementById("psuNote").innerHTML = loadPct > 100
    ? `<b>The supply is overloaded.</b> ${fmt(wallW)} W on a ${S.psu} W unit. It will shut down under load or trip its over-current protection. You need at least ${recommended} W.`
    : transient > S.psu
      ? `<b>Marginal.</b> Sustained load fits, but transient peaks reach ≈${fmt(transient)} W. Older or budget units trip their OCP here. ${recommended} W removes the risk.`
      : loadPct > 85
        ? `It works, but the supply runs at ${loadPct.toFixed(0)}% — outside the efficiency sweet spot and with no room for a future GPU. ${recommended} W would be the comfortable choice.`
        : `Well sized. ${loadPct.toFixed(0)}% sustained load keeps the supply in its efficient range with room for transients. Recommended minimum for this system: ${recommended} W.`;

  document.getElementById("chart").innerHTML = sparkline([cpuW, gpuW, S.extras, lostW], ["CPU", "GPU", "System", "Lost as<br>PSU heat"], 1);
  mountCharts(document.getElementById("chart"));

  const kwhDay = wallW / 1000 * S.hours;
  document.getElementById("costs").innerHTML = `
    <thead><tr><th>Period</th><th>Energy</th><th>Cost</th><th>Equivalent</th></tr></thead>
    <tbody>
      <tr><td class="spec-label">Per hour</td><td class="pf-mono">${(wallW / 1000).toFixed(3)} kWh</td><td class="pf-mono">${(wallW / 1000 * S.price).toFixed(3)}</td><td>—</td></tr>
      <tr><td class="spec-label">Per gaming session (${S.hours} h)</td><td class="pf-mono">${kwhDay.toFixed(2)} kWh</td><td class="pf-mono">${(kwhDay * S.price).toFixed(2)}</td><td>—</td></tr>
      <tr><td class="spec-label">Per month</td><td class="pf-mono">${(kwhDay * 30).toFixed(1)} kWh</td><td class="pf-mono">${(kwhDay * 30 * S.price).toFixed(2)}</td><td>≈ ${(kwhDay * 30 / 60).toFixed(0)} loads of laundry</td></tr>
      <tr><td class="spec-label">Per year</td><td class="pf-mono">${(kwhDay * 365).toFixed(0)} kWh</td><td class="pf-mono"><b class="c-green">${(kwhDay * 365 * S.price).toFixed(2)}</b></td><td>≈ ${(kwhDay * 365 / 1500).toFixed(1)} round-trip flights' worth of nothing</td></tr>
    </tbody>`;

  const annual = kwhDay * 365 * S.price;
  document.getElementById("summary").innerHTML = `
    <b>Reading the numbers.</b> The ${cpu.name} and ${gpu.name} together draw <b>${fmt(dcW)} W</b> while
    ${S.intensity === "idle" ? "sitting on the desktop" : S.intensity === "gaming" ? "gaming" : S.intensity === "cpuheavy" ? "rendering" : "running a GPU-heavy workload"}.
    Your ${S.eff >= 0.9 ? "platinum/titanium" : S.eff >= 0.87 ? "gold" : "bronze"} supply wastes <b>${lostW} W</b> converting that from the wall —
    ${Math.round(lostW / Math.max(dcW, 1) * 100)}% overhead, which lands directly in your case as heat.
    <br><br><b>Cost:</b> ${S.hours} hours a day works out to <b>${annual.toFixed(0)} per year</b> at ${S.price} per kWh
    — roughly ${(annual / 12).toFixed(2)} a month. Upgrading to a titanium-rated supply would save
    ${(kwhDay * 365 * S.price * (1 / S.eff - 1 / 0.92)).toFixed(0)} a year — usually less than the price difference over the life of the unit.
    <br><br><b>Sizing:</b> aim for <b>${recommended} W</b>. That covers the ${fmt(transient)} W transient peak modern GPUs produce
    and keeps the supply in its 40–70% efficiency window.${S.intensity === "gaming" ? ` Note that a CPU-limited system draws noticeably less than this — the GPU cannot spend power it is not being given work for.` : ""}`;
}

["cpu", "gpu", "intensity"].forEach(id => on(id, "change", () => { S[id] = val(id); estimatePower(); }));
on("psu", "change", () => { S.psu = num("psu", 750); estimatePower(); });
on("efficiency", "change", () => { S.eff = num("efficiency", 0.87); estimatePower(); });
on("price", "input", () => { S.price = num("price", 0.25); estimatePower(); });
on("hours", "input", () => { S.hours = num("hours", 3); estimatePower(); });
on("extras", "change", () => { S.extras = num("extras", 65); estimatePower(); });
on("run", "click", () => { estimatePower(); toast("Power draw estimated"); });

estimatePower();
</script>
</body>
</html>
