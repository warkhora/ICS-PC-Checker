<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storage &amp; Load Times — PCFORGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>

<div class="pf-container">

  <header class="pf-hero">
    <div class="pf-eyebrow">● Load times &amp; streaming</div>
    <h1>Storage &amp; Load Times</h1>
    <p>Does your drive slow the game down? Load times, first-run shader compilation, and
       whether the drive can stream an open world fast enough to keep up with the engine.</p>
  </header>

  <section class="pf-card pf-card-hover reveal">
    <h2><span class="ico">💾</span> Drive &amp; game</h2>
    <div class="pf-grid pf-grid-3">
      <div><label class="pf-label" for="storageType">Drive type</label><select id="storageType"></select></div>
      <div><label class="pf-label" for="capacity">Drive capacity</label>
        <select id="capacity"><option value="512">512 GB</option><option value="1000" selected>1 TB</option><option value="2000">2 TB</option><option value="4000">4 TB</option></select>
      </div>
      <div><label class="pf-label" for="free">Space currently free</label>
        <select id="free"><option value="0.1">Under 10%</option><option value="0.25">About 25%</option><option value="0.5" selected>About half</option><option value="0.8">Mostly empty</option></select>
      </div>
    </div>
    <div class="pf-grid pf-grid-3" style="margin-top:14px;">
      <div><label class="pf-label" for="game">Game</label><select id="game"></select></div>
      <div><label class="pf-label" for="ds">DirectStorage</label>
        <select id="ds"><option value="on" selected>Enabled / supported</option><option value="off">Disabled or unsupported</option></select>
      </div>
      <div><label class="pf-label" for="cpu">CPU (for shader compilation)</label><select id="cpu"></select></div>
    </div>
    <button class="pf-btn" id="run">Analyze storage</button>
  </section>

  <section class="pf-card reveal">
    <h2><span class="ico">⏱</span> Results</h2>
    <div class="pf-grid pf-grid-3" id="stats"></div>
    <div class="pf-section-title">Compared to a Gen4 NVMe</div>
    <div id="chart"></div>
    <div class="pf-section-title">Detail</div>
    <div class="pf-scroll"><table class="pf-table" id="table"></table></div>
    <div class="pf-summary" id="summary"></div>
  </section>

</div>

<script src="assets/data.js"></script>
<script src="assets/engine.js"></script>
<script>
const S = { storage: "nvme4", capacity: 1000, free: 0.5, game: "fh6", ds: "on", cpu: "9600x" };

fillEnumSelect(document.getElementById("storageType"), STORAGE_TYPES, S.storage);
fillSelect(document.getElementById("game"), GAMES, { groupKey: "genre", value: S.game });
fillSelect(document.getElementById("cpu"), CPUS.filter(c => !c.integrated), { groupKey: "brand", value: S.cpu });

function clock(s) {
  const m = Math.floor(s / 60), r = Math.round(s % 60);
  return m ? `${m}m ${String(r).padStart(2, "0")}s` : `${r}s`;
}

function analyze() {
  const st = STORAGE_TYPES[S.storage];
  const game = gameById(S.game);
  const cpu = cpuById(S.cpu);

  /* --- load time -------------------------------------------------------- */
  /* Baseline is measured on Gen4. Slower drives scale with a mix of sequential
     throughput and random access, since loading is mostly small-file seeks. */
  const ref = STORAGE_TYPES.nvme4;
  const seqFactor = Math.pow(ref.mbps / st.mbps, 0.55);
  const rndFactor = Math.pow(ref.random / st.random, 0.35);
  const dsFactor = S.ds === "on" && st.mbps >= 3000 ? 0.82 : 1;       // DirectStorage bypasses the CPU copy path
  const fillFactor = S.free < 0.15 ? 1.55 : S.free < 0.3 ? 1.12 : 1;  // SSDs slow down as they fill
  const loadSec = Math.max(4, game.load * seqFactor * rndFactor * dsFactor * fillFactor);
  const refSec = game.load;

  /* --- shader compilation ----------------------------------------------- */
  const shaderSec = game.shader * (75 / Math.max(cpu.gaming * 0.75 + cpu.mt * 0.25, 10)) * (st.mbps < 1000 ? 1.5 : 1);

  /* --- streaming ---------------------------------------------------------- */
  const demand = game.storage === "ssd" ? 0.85 : 0.5;                 // how hard the engine hammers the disk
  const supply = clamp((st.stream * 0.6 + Math.min(st.random / 700, 1) * 0.4), 0, 1);
  const streamScore = clamp(supply / demand, 0, 1.25) * 100;

  const rows = [
    ["Drive", st.label, `${fmt(st.mbps)} MB/s sequential`, `${fmt(st.random)} MB/s random`, ""],
    ["Install size", `${game.sizeGB} GB`, `Needs ${game.sizeGB + 20} GB free`, `${S.capacity} GB drive, ${Math.round(S.free * 100)}% free`, S.free * S.capacity < game.sizeGB + 20 ? "red" : "green"],
    ["Load into gameplay", clock(loadSec), `Gen4 reference: ${clock(refSec)}`, loadSec > refSec * 1.4 ? `${Math.round((loadSec / refSec - 1) * 100)}% slower than a Gen4 drive` : "At or near the fastest available", loadSec > refSec * 2 ? "red" : loadSec > refSec * 1.4 ? "" : "green"],
    ["Shader compilation", game.shader ? clock(shaderSec) : "None", game.shader ? "First run only" : "This title has no shader cache build", game.shader > 120 ? "Long wait on first launch — do not skip it, or you will stutter in-game" : "", "green"],
    ["DirectStorage", S.ds === "on" && st.mbps >= 3000 ? "Active" : "Inactive", "Requires NVMe", S.ds === "on" && st.mbps >= 3000 ? "Cuts load times by roughly 18% by bypassing the CPU copy path" : S.ds === "on" ? "Drive is too slow to benefit" : "Disabled", ""],
    ["Free space", `${Math.round(S.free * 100)}%`, "Keep 15%+ free", S.free < 0.15 ? "SSD write performance collapses below ~10% free" : S.free < 0.3 ? "Getting tight — garbage collection will slow writes" : "Healthy", S.free < 0.15 ? "red" : S.free < 0.3 ? "" : "green"],
    ["Streaming headroom", `${streamScore.toFixed(0)}%`, "100% = keeps up", streamScore >= 100 ? "The drive can feed the engine as fast as it asks" : streamScore >= 70 ? "Mostly fine, occasional pop-in in dense areas" : "Expect texture pop-in and hitches while travelling", streamScore >= 100 ? "green" : streamScore >= 70 ? "" : "red"]
  ];

  document.getElementById("stats").innerHTML = `
    <div class="pf-stat"><div class="pf-stat-label">Load into gameplay</div>
      <div class="pf-stat-value ${loadSec > refSec * 2 ? "c-red" : loadSec > refSec * 1.4 ? "c-orange" : "c-green"}">${clock(loadSec)}</div>
      <div class="pf-stat-note">${game.name}</div></div>
    <div class="pf-stat"><div class="pf-stat-label">Shader compilation</div>
      <div class="pf-stat-value">${game.shader ? clock(shaderSec) : "—"}</div>
      <div class="pf-stat-note">${game.shader ? "Once, on first launch" : "Not used by this engine"}</div></div>
    <div class="pf-stat"><div class="pf-stat-label">Streaming score</div>
      <div class="pf-stat-value ${streamScore >= 100 ? "c-green" : streamScore >= 70 ? "c-gold" : "c-red"}">${streamScore.toFixed(0)}<small>%</small></div>
      <div class="pf-stat-note">Ability to keep up with open-world streaming</div></div>`;

  const order = ["hdd", "sata", "nvme3", "nvme4", "nvme5"];
  document.getElementById("chart").innerHTML = sparkline(
    order.map(k => {
      const d = STORAGE_TYPES[k];
      return Math.max(4, game.load * Math.pow(ref.mbps / d.mbps, 0.55) * Math.pow(ref.random / d.random, 0.35) * fillFactor);
    }),
    order.map(k => STORAGE_TYPES[k].label.replace(" (5400–7200 rpm)", "").replace("NVMe ", "")),
    order.indexOf(S.storage));
  mountCharts(document.getElementById("chart"));

  document.getElementById("table").innerHTML = `
    <thead><tr><th>Item</th><th>Your setup</th><th>Reference</th><th>Assessment</th></tr></thead>
    <tbody>${rows.map(([a, b, c, d, tone]) => `<tr>
      <td class="spec-label">${a}</td>
      <td><b class="${tone === "red" ? "c-red" : tone === "green" ? "c-green" : ""}">${b}</b></td>
      <td class="c-dim">${c}</td><td>${d}</td></tr>`).join("")}</tbody>`;

  document.getElementById("summary").innerHTML = `
    <b>Bottom line.</b> ${game.name} takes <b>${clock(loadSec)}</b> to reach gameplay on your ${st.label.toLowerCase()} —
    ${loadSec > refSec * 2 ? `more than double the ${clock(refSec)} of a Gen4 drive.` : loadSec > refSec * 1.4 ? `noticeably slower than the ${clock(refSec)} reference.` : "about as fast as current storage allows."}
    ${S.storage === "hdd" ? "<b class='c-red'>A hard drive is the single worst component in this system.</b> Modern titles stream assets continuously while you play; a spinning disk cannot keep up, and you will see pop-in, hitches and rubber-banding regardless of how fast your GPU is." : ""}
    ${S.free < 0.15 ? "<br><br>Your drive is nearly full. NAND needs free blocks for garbage collection — below 10% free, write speeds can drop by half or more. Clear space before blaming the game." : ""}
    <br><br><b>Streaming:</b> ${streamScore >= 100 ? "your drive keeps up with everything the engine throws at it." : streamScore >= 70 ? "your drive mostly keeps up, but dense areas may pop textures in late." : "your drive cannot feed the engine fast enough — this is a storage bottleneck, not a GPU one."}
    ${game.shader ? `<br><br><b>Shaders:</b> the ${clock(shaderSec)} compile on first launch is normal and happens once. Skipping it (by force-quitting) guarantees stutter for the rest of your session.` : ""}`;
}

["storageType", "game", "cpu", "ds"].forEach(id => on(id, "change", () => {
  if (id === "storageType") S.storage = val(id); else S[id] = val(id); analyze();
}));
on("capacity", "change", () => { S.capacity = num("capacity", 1000); analyze(); });
on("free", "change", () => { S.free = num("free", 0.5); analyze(); });
on("run", "click", () => { analyze(); toast("Storage analysed"); });

analyze();
</script>
</body>
</html>
