<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build a PC — PCFORGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>

<div class="pf-container">

  <header class="pf-hero">
    <div class="pf-eyebrow">● Budget builder</div>
    <h1>Build a PC</h1>
    <p>Set a budget and a goal. The builder splits your money between the parts that
       actually matter for it, picks real components that fit, and then estimates the
       frame rate you will get — VRAM included.</p>
  </header>

  <section class="pf-card pf-card-hover reveal">
    <h2><span class="ico">💰</span> Budget &amp; goals</h2>
    <div class="pf-grid pf-grid-3">
      <div><label class="pf-label" for="budget">Budget (USD)</label><input type="number" id="budget" value="1500" min="500" step="100"></div>
      <div><label class="pf-label" for="resolution">Target resolution</label><select id="resolution"></select></div>
      <div><label class="pf-label" for="priority">Priority</label>
        <select id="priority">
          <option value="fps">Maximum FPS</option>
          <option value="balanced" selected>Balanced</option>
          <option value="quiet">Quiet &amp; cool</option>
          <option value="future">Future-proof (VRAM + cores)</option>
        </select>
      </div>
    </div>
    <div class="pf-grid pf-grid-3" style="margin-top:14px;">
      <div><label class="pf-label" for="game">Reference game</label><select id="game"></select></div>
      <div><label class="pf-label" for="rt">Ray tracing</label><select id="rt"></select></div>
      <div><label class="pf-label" for="includeOs">Include Windows license?</label>
        <select id="includeOs"><option value="yes" selected>Yes (+$120)</option><option value="no">No, I have one</option></select>
      </div>
    </div>
    <button class="pf-btn" id="run">Generate build</button>
  </section>

  <section class="pf-card reveal">
    <h2><span class="ico">🏗</span> Your build</h2>
    <div id="blocked" class="pf-note red hidden"></div>
    <div id="out">
      <div class="pf-grid pf-grid-3" id="headline"></div>
      <div class="pf-section-title">Parts list</div>
      <div class="pf-scroll"><table class="pf-table" id="parts"></table></div>
      <div class="pf-note" id="totalNote"></div>
      <div class="pf-section-title">What it gets you</div>
      <div id="chart"></div>
      <div class="pf-summary" id="summary"></div>
    </div>
  </section>

</div>

<script src="assets/data.js"></script>
<script src="assets/engine.js"></script>
<script>
const S = { budget: 1500, resolution: "1440p", priority: "balanced", game: "fh6", rt: "high", os: true };

fillEnumSelect(document.getElementById("resolution"), RESOLUTIONS, S.resolution);
fillSelect(document.getElementById("game"), GAMES, { groupKey: "genre", value: S.game });

/* Share of the budget the CPU is allowed to claim. Whatever is left after the
   CPU and the supporting parts goes to the GPU, so a smaller number here means
   a stronger graphics card. */
const CPU_SHARE = { fps: 0.14, balanced: 0.18, quiet: 0.17, future: 0.22 };

const RAM_KITS = [
  { name: "16 GB (2×8) DDR4-3200", price: 40,  gb: 16, speed: "ddr4-3200" },
  { name: "32 GB (2×16) DDR4-3600", price: 70, gb: 32, speed: "ddr4-3600" },
  { name: "16 GB (2×8) DDR5-5600", price: 60,  gb: 16, speed: "ddr5-5600" },
  { name: "32 GB (2×16) DDR5-6000 CL30", price: 105, gb: 32, speed: "ddr5-6000" },
  { name: "32 GB (2×16) DDR5-6400", price: 135, gb: 32, speed: "ddr5-6400" },
  { name: "64 GB (2×32) DDR5-6000", price: 210, gb: 64, speed: "ddr5-6000" }
];
const SSDS = [
  { name: "1 TB NVMe Gen4", price: 70,  gb: 1000, type: "nvme4" },
  { name: "2 TB NVMe Gen4", price: 120, gb: 2000, type: "nvme4" },
  { name: "2 TB NVMe Gen5", price: 190, gb: 2000, type: "nvme5" },
  { name: "4 TB NVMe Gen4", price: 240, gb: 4000, type: "nvme4" }
];
const FANS = [
  { name: "2× 120 mm case fans", price: 25 },
  { name: "4× 120 mm PWM fans", price: 55 },
  { name: "6× 140 mm high-airflow fans", price: 95 }
];
const OS_PRICE = 120;

/* Best-scoring item that fits the budget. If nothing fits, fall back to the
   cheapest item in the category so the build still completes (and the total
   visibly goes over budget). Returns null when the category has no candidates. */
function bestUnder(list, cap, scoreFn) {
  if (!list.length) return null;
  const ok = list.filter(i => i.price <= cap);
  if (!ok.length) return list.reduce((a, b) => (a.price < b.price ? a : b));
  return ok.reduce((a, b) => (scoreFn(b) > scoreFn(a) ? b : a));
}

/* The graphics card decides the frame rate, so it never falls back to the
   cheapest card in the database — a $139 entry card in a $900 build is worse
   than going slightly over budget on a real one. */
function gpuScore(g) { return S.priority === "future" ? g.index * (g.vram >= 16 ? 1.18 : 1) : g.index; }
function pickGpu(cap) {
  const pool = GPUS.filter(g => g.price);
  const affordable = pool.filter(g => g.price <= cap);
  if (affordable.length) return affordable.reduce((a, b) => (gpuScore(b) > gpuScore(a) ? b : a));
  const real = pool.filter(g => g.index >= 60).sort((a, b) => a.price - b.price);
  return real[0] || pool[0];
}

/* Cheapest build that is still worth switching a PC on. Used for the floor warning. */
function minimumViable() {
  const cpu = CPUS.filter(c => c.price && !c.integrated).sort((a, b) => a.price - b.price)
    .find(c => c.gaming >= 55) || cpuById("12400f");
  const board = MOTHERBOARDS.filter(b => b.socket === cpu.socket).sort((a, b) => a.price - b.price)[0] || MOTHERBOARDS[1];
  const ram = RAM_KITS.filter(k => RAM_SPEEDS[k.speed].type === board.ram).sort((a, b) => a.price - b.price)[0] || RAM_KITS[2];
  const cooler = COOLERS.filter(c => c.tdp >= cpu.ppt).sort((a, b) => a.price - b.price)[0] || COOLERS[1];
  const gpu = GPUS.filter(g => g.price && g.index >= 60).sort((a, b) => a.price - b.price)[0] || GPUS[0];
  const psu = Math.round(Math.max(550, Math.ceil((cpu.ppt + gpu.tdp + 90) * 1.3 / 50) * 50) * 0.16);
  return cpu.price + board.price + ram.price + cooler.price + SSDS[0].price + CASES[0].price + FANS[0].price + gpu.price + psu;
}

/* A realistic build pays for the boring parts first, then spends whatever is
   left on the two components that decide frame rate. Splitting the whole
   budget by percentage instead starves the GPU on small budgets. */
function build() {
  let budget = S.budget;
  if (S.os) budget -= OS_PRICE;

  const blocked = document.getElementById("blocked");
  const floor = minimumViable() + (S.os ? OS_PRICE : 0);
  if (budget < floor) {
    blocked.classList.remove("hidden");
    blocked.innerHTML = `<b>$${fmt(S.budget)} is below the practical floor for a new gaming PC.</b>
      The cheapest build that is still worth switching on — a modern 6-core CPU, a real graphics card,
      board, memory, NVMe storage, cooling, case and a quality supply — costs about
      <b class="c-gold">$${fmt(floor)}</b>${S.os ? " including Windows" : ""}.
      ${S.os ? `Unticking Windows brings the floor down to <b>$${fmt(floor - OS_PRICE)}</b>. ` : ""}
      Below that, a used system gives you considerably more for the money.`;
    document.getElementById("out").classList.add("hidden");
    return;
  }
  blocked.classList.add("hidden");
  document.getElementById("out").classList.remove("hidden");

  /* ---- 1. CPU: takes its share of the money first ----------------------- */
  const cpuShare = CPU_SHARE[S.priority] ?? 0.18;
  const cpuCap = clamp(budget * cpuShare, 159, 700);
  const cpu = bestUnder(CPUS.filter(c => c.price && !c.integrated), cpuCap, c => c.gaming)
           || cpuById("12400f");

  /* ---- 2. Everything that has to match the CPU -------------------------- */
  const boards = MOTHERBOARDS.filter(b => b.socket === cpu.socket &&
    RAM_KITS.some(k => RAM_SPEEDS[k.speed].type === b.ram));
  const board = bestUnder(boards, clamp(budget * 0.13, 109, 400),
                          b => b.m2 * 10 + (b.pcie === "5.0" ? 20 : 0)) || MOTHERBOARDS.find(b => b.ram === "DDR5");

  const ramKit = bestUnder(RAM_KITS.filter(k => RAM_SPEEDS[k.speed].type === board.ram),
                           clamp(budget * 0.08, 40, 210),
                           k => (k.gb >= 32 ? 20 : 0) + parseInt(k.speed.split("-")[1]) / 100) || RAM_KITS[2];

  const coolerPool = COOLERS.filter(c => c.tdp >= cpu.ppt);
  const cooler = S.priority === "quiet"
    ? (coolerPool.slice().sort((a, b) => a.noise - b.noise).filter(c => c.price <= clamp(budget * 0.10, 40, 250))[0] || COOLERS[3])
    : (bestUnder(coolerPool, clamp(budget * 0.06, 40, 250), c => c.tdp) || COOLERS[3]);

  const ssd = bestUnder(SSDS, clamp(budget * 0.08, 70, 240), x => x.gb) || SSDS[0];
  const kase = bestUnder(CASES, clamp(budget * 0.08, 69, 249),
                         c => (c.airflow === "high" ? 3 : c.airflow === "balanced" ? 2 : 1) + (c.gpuMax >= 400 ? 2 : 0)) || CASES[2];
  const fans = bestUnder(FANS, clamp(budget * 0.03, 25, 95), f => f.price) || FANS[0];

  /* ---- 3. The GPU gets everything that is left -------------------------- */
  const spent = board.price + ramKit.price + cooler.price + ssd.price + kase.price + fans.price + cpu.price;
  const gpuCap = Math.max(budget - spent, 120);
  const gpu = pickGpu(gpuCap);

  /* The GPU has to physically fit the case we picked — swap the case if not. */
  const fittingCase = kase.gpuMax >= gpu.length && kase.form.includes(board.form)
    ? kase
    : (CASES.find(c => c.gpuMax >= gpu.length && c.form.includes(board.form)) || kase);

  const psuW = Math.max(550, Math.ceil((cpu.ppt + gpu.tdp + 90) * 1.3 / 50) * 50);
  const psuPrice = Math.round(psuW * 0.16);

  const lines = [
    { part: "CPU", item: cpu.name, price: cpu.price, note: `${cpu.cores}C/${cpu.threads}T · gaming index ${cpu.gaming} · ${cpu.socket}` },
    { part: "GPU", item: gpu.name, price: gpu.price, note: `${gpu.vram} GB ${gpu.vramType} · raster index ${gpu.index} · ${gpu.tdp} W` },
    { part: "Motherboard", item: board.name, price: board.price, note: `${board.socket} · ${board.ram} · ${board.m2}× M.2 · ${board.form}` },
    { part: "Memory", item: ramKit.name, price: ramKit.price, note: `Dual channel · ${RAM_SPEEDS[ramKit.speed].label}` },
    { part: "Storage", item: ssd.name, price: ssd.price, note: `${STORAGE_TYPES[ssd.type].label} · ${fmt(STORAGE_TYPES[ssd.type].mbps)} MB/s` },
    { part: "Cooler", item: cooler.name, price: cooler.price, note: `Rated ${cooler.tdp} W vs a ${cpu.ppt} W CPU · ≈${cooler.noise} dB(A)` },
    { part: "Case", item: fittingCase.name, price: fittingCase.price, note: `GPU ≤ ${fittingCase.gpuMax} mm · ${fittingCase.airflow} airflow` },
    { part: "Power supply", item: `${psuW} W 80+ Gold`, price: psuPrice, note: `Sized for ${cpu.ppt + gpu.tdp + 90} W of load plus transient headroom` },
    { part: "Case fans", item: fans.name, price: fans.price, note: "Intake + exhaust" }
  ];
  if (S.os) lines.push({ part: "Operating system", item: "Windows 11 Home (retail)", price: OS_PRICE, note: "Skip if you already have a licence" });

  const total = lines.reduce((a, l) => a + l.price, 0);

  /* ---- render ---- */
  document.getElementById("parts").innerHTML = `
    <thead><tr><th>Component</th><th>Part</th><th>Price</th><th>Why this one</th></tr></thead>
    <tbody>${lines.map(l => `<tr>
      <td class="spec-label">${l.part}</td><td><b>${l.item}</b></td>
      <td class="pf-mono">$${fmt(l.price)}</td><td>${l.note}</td></tr>`).join("")}</tbody>`;

  document.getElementById("totalNote").innerHTML =
    `Total <b class="c-gold">$${fmt(total)}</b> against a $${fmt(S.budget)} budget — ` +
    (total <= S.budget ? `<b class="c-green">$${fmt(S.budget - total)} left over</b>.` :
     `<b class="c-red">$${fmt(total - S.budget)} over</b>. Drop one GPU tier, or untick Windows, to fit.`);

/* FPS at the reference settings */
  const game = gameById(S.game);
  const resList = ["1080p", "1440p", "4K"];
  const fpsList = resList.map(res => {
    const r = estimate({ cpu: cpu.id, gpu: gpu.id, game: S.game, resolution: res, quality: "ultra",
                         rt: gameSupportsRT(game) && isRT(gpu) ? S.rt : "off", upscaler: "off", fg: "off",
                         ramGb: ramKit.gb, ramSpeed: ramKit.speed });
    return r.blocked ? 0 : r.fps;
  });
  const target = fpsList[resList.indexOf(S.resolution)] ?? fpsList[1];

  document.getElementById("headline").innerHTML = `
    <div class="pf-stat"><div class="pf-stat-label">${S.resolution} ${QUALITY.ultra.label}</div>
      <div class="pf-stat-value ${fpsClass(target).cls}">${target}<small> fps</small></div>
      <div class="pf-stat-note">${game.name}</div></div>
    <div class="pf-stat"><div class="pf-stat-label">Total cost</div>
      <div class="pf-stat-value">$${fmt(total)}</div>
      <div class="pf-stat-note">$${(total / Math.max(target, 1)).toFixed(2)} per FPS at ${S.resolution}</div></div>
    <div class="pf-stat"><div class="pf-stat-label">VRAM headroom</div>
      <div class="pf-stat-value ${gpu.vram >= 16 ? "c-green" : gpu.vram >= 12 ? "c-gold" : "c-orange"}">${gpu.vram}<small> GB</small></div>
      <div class="pf-stat-note">${gpu.vram >= 16 ? "Comfortable for 2026 titles" : gpu.vram >= 12 ? "Fine now, tight by 2027" : "Will overflow in demanding titles"}</div></div>`;

  document.getElementById("chart").innerHTML = sparkline(fpsList, resList, resList.indexOf(S.resolution));
  mountCharts(document.getElementById("chart"));

  /* Balance verdict */
  const bal = estimate({ cpu: cpu.id, gpu: gpu.id, game: S.game, resolution: S.resolution, quality: "ultra",
                         rt: "off", upscaler: "off", fg: "off", ramGb: ramKit.gb, ramSpeed: ramKit.speed });
  const vramAtTarget = estimate({ cpu: cpu.id, gpu: gpu.id, game: S.game, resolution: S.resolution, quality: "ultra",
                         rt: gameSupportsRT(game) && isRT(gpu) ? S.rt : "off", upscaler: "off", fg: "off",
                         ramGb: ramKit.gb, ramSpeed: ramKit.speed });

  document.getElementById("summary").innerHTML = `
    <b>How this was chosen.</b> The supporting parts were priced first — board, memory, storage, cooling, case and a
    ${psuW} W supply sized for ${cpu.ppt + gpu.tdp + 90} W of load plus transient headroom — and everything left over
    ($${fmt(gpuCap)}) went to the graphics card. That is why the GPU is the largest single line item: it is the component
    that decides your frame rate. With "${S.priority}" as the priority, the CPU was allowed ${Math.round(cpuShare * 100)}% of the budget (capped at $${fmt(cpuCap)}).
    <br><br><b>Balance:</b> ${bal.bottleneck.kind === "balanced" ? "this pairing is well matched" : `at ${S.resolution} it is ${bal.bottleneck.kind}-limited by ≈${bal.bottleneck.pct}%`} in ${game.name}.
    ${vramAtTarget.vram.state === "over" ? `<br><br><b>Warning:</b> with ray tracing on at ${S.resolution}, this GPU needs ≈${vramAtTarget.vram.required.toFixed(1)} GB but only has ${gpu.vram} GB. ` +
      `You will spill ${vramAtTarget.vram.overflow.toFixed(1)} GB and lose ≈${Math.round((1 - vramAtTarget.vram.penalty) * 100)}% of your frames. If ray tracing matters to you, spend the difference on a card with more memory.` : ""}
    ${total > S.budget ? "<br><br>The build is over budget — the quickest fix is one GPU tier down, which usually costs 10–15% of the frame rate." : ""}`;
}

on("budget", "input", () => { S.budget = num("budget", 1500); build(); });
on("resolution", "change", () => { S.resolution = val("resolution"); build(); });
on("priority", "change", () => { S.priority = val("priority"); build(); });
on("game", "change", () => { S.game = val("game"); build(); });
on("rt", "change", () => { S.rt = val("rt"); build(); });
on("includeOs", "change", () => { S.os = val("includeOs") === "yes"; build(); });
on("run", "click", () => { build(); toast("Build generated"); });

/* RT options depend on the reference game */
(function () {
  const sel = document.getElementById("rt");
  sel.innerHTML = "";
  Object.entries(RT_LEVELS).forEach(([k, v]) => {
    if (k === "pt") return;
    const o = document.createElement("option");
    o.value = k; o.textContent = v.label;
    sel.appendChild(o);
  });
  sel.value = "high";
})();

build();
</script>
</body>
</html>
