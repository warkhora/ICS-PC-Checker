<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bottleneck Analyzer — PCFORGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>

<div class="pf-container">

  <header class="pf-hero">
    <div class="pf-eyebrow">● System balance</div>
    <h1>Bottleneck Analyzer</h1>
    <p>Which part of your PC is holding the others back — and by how much? CPU, GPU, system
       RAM, VRAM and storage are all measured against the same scenario.</p>
  </header>

  <section class="pf-card pf-card-hover reveal">
    <h2><span class="ico">🧪</span> Scenario</h2>
    <div class="pf-grid pf-grid-3">
      <div><label class="pf-label" for="cpu">CPU</label><select id="cpu"></select></div>
      <div><label class="pf-label" for="gpu">GPU</label><select id="gpu"></select></div>
      <div><label class="pf-label" for="game">Game</label><select id="game"></select></div>
    </div>
    <div class="pf-grid pf-grid-3" style="margin-top:14px;">
      <div><label class="pf-label" for="resolution">Resolution</label><select id="resolution"></select></div>
      <div><label class="pf-label" for="quality">Preset</label><select id="quality"></select></div>
      <div><label class="pf-label" for="rt">Ray tracing</label><select id="rt"></select></div>
    </div>
    <div class="pf-grid pf-grid-3" style="margin-top:14px;">
      <div><label class="pf-label" for="ramAmount">System RAM</label><select id="ramAmount"></select></div>
      <div><label class="pf-label" for="ramSpeed">RAM speed</label><select id="ramSpeed"></select></div>
      <div><label class="pf-label" for="storageType">Game drive</label><select id="storageType"></select></div>
    </div>
    <button class="pf-btn" id="run">Analyze</button>
  </section>

  <section class="pf-card reveal">
    <h2><span class="ico">📉</span> Where your system is limited</h2>
    <div id="blocked" class="pf-note red hidden"></div>
    <div id="out">
      <div class="pf-grid pf-grid-3" id="pills"></div>
      <div class="pf-section-title">Frame delivery</div>
      <div id="chart"></div>
      <div class="pf-section-title">Detail</div>
      <div class="pf-scroll"><table class="pf-table" id="table"></table></div>
      <div class="pf-summary" id="summary"></div>
    </div>
  </section>

</div>

<script src="assets/data.js"></script>
<script src="assets/engine.js"></script>
<script>
const S = { cpu: "9800x3d", gpu: "rtx5070", game: "fh6", resolution: "1440p", quality: "ultra",
            rt: "high", ramGb: 32, ramSpeed: "ddr5-6000", storage: "nvme4" };

fillSelect(document.getElementById("cpu"), CPUS.filter(c => !c.integrated), { groupKey: "brand", value: S.cpu });
fillSelect(document.getElementById("gpu"), GPUS, { groupKey: "brand", value: S.gpu, labelFn: g => `${g.name} — ${g.vram} GB` });
fillSelect(document.getElementById("game"), GAMES, { groupKey: "genre", value: S.game });
fillEnumSelect(document.getElementById("resolution"), RESOLUTIONS, S.resolution);
fillEnumSelect(document.getElementById("quality"), QUALITY, S.quality);
fillSelect(document.getElementById("ramAmount"), RAM_AMOUNTS.map(a => ({ id: a, name: a + " GB" })), { value: 32 });
fillEnumSelect(document.getElementById("ramSpeed"), RAM_SPEEDS, S.ramSpeed);
fillEnumSelect(document.getElementById("storageType"), STORAGE_TYPES, S.storage);

function refreshRtOptions() {
  const gpu = gpuById(S.gpu), game = gameById(S.game);
  const sel = document.getElementById("rt");
  const rtOk = gameSupportsRT(game) && isRT(gpu);
  sel.innerHTML = "";
  Object.entries(RT_LEVELS).forEach(([k, v]) => {
    if (k === "pt" && !gameSupportsPT(game)) return;
    if (k !== "off" && !rtOk) return;
    if (game.alwaysPT && k !== "pt") return;
    const o = document.createElement("option");
    o.value = k; o.textContent = v.label;
    sel.appendChild(o);
  });
  if (!sel.options.length) { const o = document.createElement("option"); o.value = "off"; o.textContent = "Off"; sel.appendChild(o); }
  if (![...sel.options].some(o => o.value === S.rt)) S.rt = sel.options[0].value;
  sel.value = S.rt;
}

function run() {
  refreshRtOptions();
  const r = estimate({ cpu: S.cpu, gpu: S.gpu, game: S.game, resolution: S.resolution, quality: S.quality,
                       rt: S.rt, upscaler: "off", fg: "off", ramGb: S.ramGb, ramSpeed: S.ramSpeed });

  if (r.blocked) {
    document.getElementById("blocked").classList.remove("hidden");
    document.getElementById("blocked").innerHTML = `<b>Cannot analyse.</b> ${r.reason}`;
    document.getElementById("out").classList.add("hidden");
    return;
  }
  document.getElementById("blocked").classList.add("hidden");
  document.getElementById("out").classList.remove("hidden");

  /* ---- derive a percentage for every subsystem ------------------------- */
  const cpuLimit = clamp(1 - r.cpuFps / Math.max(r.gpuFps, r.cpuFps), 0, 1) * 100;  // how much the CPU drags
  const gpuLimit = clamp(1 - r.gpuFps / Math.max(r.gpuFps, r.cpuFps), 0, 1) * 100;
  const vramLimit = r.vram.overflow > 0 ? clamp((1 - r.vram.penalty) * 100, 0, 100)
                    : r.vram.fill > 0.92 ? 8 : 0;
  const ramLimit = r.ram.penalty < 1 ? clamp((1 - r.ram.penalty) * 100, 0, 100) : 0;

  const st = STORAGE_TYPES[S.storage];
  const stDemand = r.game.storage === "ssd" ? 0.75 : 0.45;                       // how much this game cares
  const stScore = clamp(st.stream * (st.random / 600), 0, 1);
  const storageLimit = clamp((1 - stScore) * stDemand * 100, 0, 100);

  const parts = [
    { key: "cpu",     label: "CPU",     pct: cpuLimit,     tone: cpuLimit > 25 ? "red" : cpuLimit > 10 ? "" : "green",
      note: `${r.cpu.name} can feed ${fmt(Math.round(r.cpuFps))} fps; the GPU wants ${fmt(Math.round(r.gpuFps))}.` },
    { key: "gpu",     label: "GPU",     pct: gpuLimit,     tone: gpuLimit > 25 ? "red" : gpuLimit > 10 ? "" : "green",
      note: `${r.gpu.name} tops out at ${fmt(Math.round(r.gpuFps))} fps here.` },
    { key: "vram",    label: "VRAM",    pct: vramLimit,    tone: r.vram.state === "over" ? "red" : r.vram.state === "tight" ? "" : "green",
      note: `${r.vram.required.toFixed(1)} GB needed / ${r.gpu.vram} GB available${r.vram.overflow > 0 ? ` — ${r.vram.overflow.toFixed(1)} GB spilling into system RAM` : ""}.` },
    { key: "ram",     label: "System RAM", pct: ramLimit,  tone: ramLimit > 12 ? "red" : ramLimit > 0 ? "" : "green",
      note: `${S.ramGb} GB ${r.ram.speedLabel}. ${r.ram.note}` },
    { key: "storage", label: "Storage", pct: storageLimit, tone: storageLimit > 35 ? "red" : storageLimit > 15 ? "" : "green",
      note: `${st.label} — ${fmt(st.mbps)} MB/s sequential, ${st.random} MB/s random.` }
  ];

  document.getElementById("pills").innerHTML = parts.map(p => `
    <div class="pf-stat">
      <div class="pf-stat-label">${p.label} bottleneck</div>
      <div class="pf-stat-value ${p.tone === "red" ? "c-red" : p.tone === "green" ? "c-green" : "c-gold"}">${p.pct.toFixed(0)}<small>%</small></div>
      <div class="pf-bar ${p.tone === "red" ? "red" : p.tone === "green" ? "green" : ""}"><i data-w="${p.pct}"></i></div>
      <div class="pf-stat-note">${p.note}</div>
    </div>`).join("");
  requestAnimationFrame(() => document.querySelectorAll("#pills .pf-bar > i").forEach(el => el.style.width = clamp(+el.dataset.w, 0, 100) + "%"));

  /* ---- chart of the ceilings ------------------------------------------ */
  document.getElementById("chart").innerHTML = sparkline(
    [r.gpuFps, r.cpuFps, r.fps],
    ["GPU ceiling", "CPU ceiling", "Actual<br>frame rate"], 2);
  mountCharts(document.getElementById("chart"));

  /* ---- table ----------------------------------------------------------- */
  document.getElementById("table").innerHTML = `
    <thead><tr><th>Subsystem</th><th>Limits you by</th><th>Detail</th></tr></thead>
    <tbody>${parts.map(p => `<tr>
      <td class="spec-label">${p.label}</td>
      <td><span class="pf-chip ${p.tone === "red" ? "red" : p.tone === "green" ? "green" : "gold"}">${p.pct.toFixed(0)}%</span></td>
      <td>${p.note}</td></tr>`).join("")}</tbody>`;

  /* ---- narrative ------------------------------------------------------- */
  const worst = [...parts].sort((a, b) => b.pct - a.pct)[0];
  const runners = parts.filter(p => p.pct >= worst.pct * 0.75 && p !== worst).map(p => p.label);
  document.getElementById("summary").innerHTML = `
    <b>Verdict:</b> in ${r.game.name} at ${S.resolution} ${QUALITY[S.quality].label}${S.rt !== "off" ? " with " + RT_LEVELS[S.rt].label : ""},
    your <b>${worst.label.toLowerCase()}</b> is the primary limit at <b>${worst.pct.toFixed(0)}%</b>, delivering
    <b>${r.fps} fps</b>.
    ${runners.length ? `${runners.join(" and ")} are close behind, so fixing only the first one will not unlock the full gain.` : "Nothing else is close — this is a clean, single bottleneck."}
    ${r.vram.state === "over" ? `<br><br><b>VRAM is the quiet killer here.</b> ${r.vram.overflow.toFixed(1)} GB is spilling into system memory,
      which costs ≈${Math.round((1 - r.vram.penalty) * 100)}% of your frames <i>and</i> causes the stutter that averages hide.
      A card with more memory than ${r.gpu.vram} GB would fix both.` : ""}
    ${r.bottleneck.kind === "cpu" && cpuLimit > 25 ? "<br><br>Being CPU-limited means a GPU upgrade would be wasted money at this resolution. Either upgrade the CPU or play at a higher resolution to shift the work back to the GPU." : ""}
    ${storageLimit > 35 ? "<br><br>Your storage is slow enough to cause streaming hitches in this open-world title — move the install to an NVMe drive." : ""}`;
}

["cpu", "gpu", "game", "resolution", "quality", "rt", "ramSpeed", "storageType"].forEach(id =>
  on(id, "change", () => { S[id] = val(id); run(); }));
on("ramAmount", "change", () => { S.ramGb = num("ramAmount", 32); run(); });
on("run", "click", () => { run(); toast("Bottlenecks analysed"); });

run();
</script>
</body>
</html>
