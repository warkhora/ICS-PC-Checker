<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC Lifespan — PCFORGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>

<div class="pf-container">

  <header class="pf-hero">
    <div class="pf-eyebrow">● Longevity forecast</div>
    <h1>PC Lifespan</h1>
    <p>New games demand more every year. This projects how long your system keeps a playable
       frame rate — and which part gives out first: raw speed or VRAM.</p>
  </header>

  <section class="pf-card pf-card-hover reveal">
    <h2><span class="ico">📅</span> Your system</h2>
    <div class="pf-grid pf-grid-2">
      <div><label class="pf-label" for="cpu">CPU</label><select id="cpu"></select></div>
      <div><label class="pf-label" for="gpu">GPU</label><select id="gpu"></select></div>
    </div>
    <div class="pf-grid pf-grid-4" style="margin-top:14px;">
      <div><label class="pf-label" for="resolution">Resolution</label><select id="resolution"></select></div>
      <div><label class="pf-label" for="quality">Settings you want to keep</label><select id="quality"></select></div>
      <div><label class="pf-label" for="rt">Ray tracing</label><select id="rt"></select></div>
      <div><label class="pf-label" for="ramAmount">System RAM</label><select id="ramAmount"></select></div>
    </div>
    <div class="pf-grid pf-grid-2" style="margin-top:14px;">
      <div><label class="pf-label" for="demand">How demanding your games are</label>
        <select id="demand">
          <option value="light">Light — esports and older titles</option>
          <option value="medium" selected>Medium — mainstream AAA</option>
          <option value="heavy">Heavy — flagship UE5 releases, path tracing</option>
        </select>
      </div>
      <div><label class="pf-label" for="upscaling">Willing to use upscaling?</label>
        <select id="upscaling">
          <option value="off">No — native resolution only</option>
          <option value="quality" selected>Yes — Quality preset</option>
          <option value="performance">Yes — Performance preset</option>
        </select>
      </div>
    </div>
    <button class="pf-btn" id="run">Forecast lifespan</button>
  </section>

  <section class="pf-card reveal">
    <h2><span class="ico">⏳</span> Forecast</h2>
    <div id="blocked" class="pf-note red hidden"></div>
    <div id="out">
      <div class="pf-grid pf-grid-4" id="stats"></div>
      <div class="pf-section-title">Frame rate over the next decade (representative AAA title)</div>
      <div id="chart"></div>
      <div class="pf-section-title">What limits you, and when</div>
      <div class="pf-scroll"><table class="pf-table" id="table"></table></div>
      <div class="pf-summary" id="summary"></div>
    </div>
  </section>

</div>

<script src="assets/data.js"></script>
<script src="assets/engine.js"></script>
<script>
const S = { cpu: "9800x3d", gpu: "rtx5070", resolution: "1440p", quality: "high", rt: "high",
            ramGb: 32, demand: "medium", upscaling: "quality" };

fillSelect(document.getElementById("cpu"), CPUS.filter(c => !c.integrated), { groupKey: "brand", value: S.cpu });
fillSelect(document.getElementById("gpu"), GPUS, { groupKey: "brand", value: S.gpu, labelFn: g => `${g.name} — ${g.vram} GB` });
fillEnumSelect(document.getElementById("resolution"), RESOLUTIONS, S.resolution);
fillEnumSelect(document.getElementById("quality"), QUALITY, S.quality);
fillSelect(document.getElementById("ramAmount"), RAM_AMOUNTS.map(a => ({ id: a, name: a + " GB" })), { value: 32 });

/* AAA demand growth and VRAM growth per year, by how demanding your library is. */
const GROWTH = {
  light:  { fps: 0.06, vram: 0.25 },
  medium: { fps: 0.13, vram: 0.55 },
  heavy:  { fps: 0.19, vram: 0.80 }
};

function refreshRt() {
  const gpu = gpuById(S.gpu), sel = document.getElementById("rt");
  const rtOk = isRT(gpu);
  sel.innerHTML = "";
  [["off", "Off"], ["medium", "Medium"], ["high", "High"], ["pt", "Path tracing"]].forEach(([k, l]) => {
    if (k !== "off" && !rtOk) return;
    const o = document.createElement("option");
    o.value = k; o.textContent = l;
    sel.appendChild(o);
  });
  if (![...sel.options].some(o => o.value === S.rt)) S.rt = sel.options[0].value;
  sel.value = S.rt;
}

function yearModel(year, refGame) {
  const g = GROWTH[S.demand];
  const game = {
    ...refGame,
    base: refGame.base / Math.pow(1 + g.fps, year),     // future games are heavier
    vram: refGame.vram + g.vram * year,
    rtVram: refGame.rtVram * (1 + g.fps * year * 0.5),
    cpuCap: refGame.cpuCap / Math.pow(1 + g.fps * 0.6, year)
  };
  const r = estimate({ cpu: S.cpu, gpu: S.gpu, game, resolution: S.resolution, quality: S.quality,
                       rt: S.rt, upscaler: S.upscaling, fg: "off", ramGb: S.ramGb, ramSpeed: "ddr5-6000" });
  return r;
}

function forecast() {
  refreshRt();
  const gpu = gpuById(S.gpu);
  const ref = gameById(S.demand === "heavy" ? "cyberpunk" : S.demand === "light" ? "gtav" : "fh6");

  const blocked = document.getElementById("blocked");
  const probe = estimate({ cpu: S.cpu, gpu: S.gpu, game: ref.id, resolution: S.resolution,
                           quality: S.quality, rt: S.rt, upscaler: S.upscaling, ramGb: S.ramGb });
  if (probe.blocked) {
    blocked.classList.remove("hidden");
    blocked.innerHTML = `<b>Cannot forecast.</b> ${probe.reason}`;
    document.getElementById("out").classList.add("hidden");
    return;
  }
  blocked.classList.add("hidden");
  document.getElementById("out").classList.remove("hidden");

  const years = [];
  for (let y = 0; y <= 10; y++) years.push({ year: y, r: yearModel(y, ref) });

  const now = years[0].r;
  const below60 = years.find(p => p.r.fps < 60);
  const below30 = years.find(p => p.r.fps < 30);
  const vramYear = years.find(p => p.r.vram.state === "over");
  const tightYear = years.find(p => p.r.vram.state !== "ok");

  const smoothYears = below60 ? below60.year : 10;
  const usableYears = below30 ? below30.year : 10;
  const vramYears = vramYear ? vramYear.year : 10;

  document.getElementById("stats").innerHTML = `
    <div class="pf-stat"><div class="pf-stat-label">Today</div>
      <div class="pf-stat-value ${fpsClass(now.fps).cls}">${now.fps}<small> fps</small></div>
      <div class="pf-stat-note">${S.resolution} ${QUALITY[S.quality].label}${S.rt !== "off" ? " + " + RT_LEVELS[S.rt].label : ""}</div></div>
    <div class="pf-stat"><div class="pf-stat-label">60+ FPS for</div>
      <div class="pf-stat-value ${smoothYears >= 5 ? "c-green" : smoothYears >= 3 ? "c-gold" : "c-orange"}">${smoothYears}<small> years</small></div>
      <div class="pf-stat-note">Before new releases drop you below 60</div></div>
    <div class="pf-stat"><div class="pf-stat-label">Playable (30+) for</div>
      <div class="pf-stat-value ${usableYears >= 7 ? "c-green" : usableYears >= 4 ? "c-gold" : "c-orange"}">${usableYears}<small> years</small></div>
      <div class="pf-stat-note">Before new releases become a struggle</div></div>
    <div class="pf-stat"><div class="pf-stat-label">VRAM runs out in</div>
      <div class="pf-stat-value ${vramYears >= 5 ? "c-green" : vramYears >= 2 ? "c-orange" : "c-red"}">${vramYears}<small> years</small></div>
      <div class="pf-stat-note">${gpu.vram} GB total${vramYears === 0 ? " — already overflowing today" : vramYear ? " — spilling from " + (2025 + vramYears) : ""}</div></div>`;

  document.getElementById("chart").innerHTML = sparkline(
    years.map(p => p.r.fps),
    years.map(p => (2025 + p.year) % 5 === 0 || p.year === 0 ? "'" + String(2025 + p.year).slice(2) : ""),
    0);
  mountCharts(document.getElementById("chart"));

  const rows = [
    ["Raw GPU performance", `${smoothYears} years at 60+ FPS`, below60 ? `Drops below 60 FPS around ${2025 + below60.year}` : "Stays above 60 FPS for the full decade", smoothYears >= 5 ? "green" : smoothYears >= 3 ? "" : "red"],
    ["VRAM capacity", `${vramYears} years before spilling`, vramYear ? `New titles exceed ${gpu.vram} GB around ${2025 + vramYear.year} — spill costs frames <i>and</i> causes stutter` : `${gpu.vram} GB stays sufficient for the full decade`, vramYears >= 5 ? "green" : vramYears >= 2 ? "" : "red"],
    ["CPU headroom", now.bottleneck.kind === "cpu" ? "Already the limit" : "Not the limit yet", now.bottleneck.kind === "cpu" ? `The ${cpuById(S.cpu).name} is holding back the ${gpu.name} today` : `The ${cpuById(S.cpu).name} keeps up at ${S.resolution}`, now.bottleneck.kind === "cpu" ? "red" : "green"],
    ["System RAM", `${S.ramGb} GB`, S.ramGb >= 32 ? "Comfortable for the next several years" : S.ramGb >= 16 ? "Fine today, tight by 2027" : "Already below what modern titles want", S.ramGb >= 32 ? "green" : S.ramGb >= 16 ? "" : "red"],
    ["Upscaling runway", S.upscaling === "off" ? "Unused" : `${upscalerName(gpu)} ${S.upscaling}`, S.upscaling === "off" ? "You have a large reserve — turning on upscaling typically doubles this system's remaining life" : `Already banked. Roughly +${Math.round((upscalerMultiplier(gpu, S.upscaling) - 1) * 100)}% frames from ${upscalerName(gpu)}.`, "green"],
    ["Frame generation", gpu.fg ? `Available (up to ${gpu.fg}×)` : "Not supported", gpu.fg ? "A final reserve when raw performance runs out — costs latency, not image quality" : "This generation has no frame generation to fall back on", gpu.fg ? "green" : ""]
  ];

  document.getElementById("table").innerHTML = `
    <thead><tr><th>Factor</th><th>Verdict</th><th>Detail</th></tr></thead>
    <tbody>${rows.map(([a, b, c, tone]) => `<tr>
      <td class="spec-label">${a}</td>
      <td><span class="pf-chip ${tone === "red" ? "red" : tone === "green" ? "green" : "orange"}">${b}</span></td>
      <td>${c}</td></tr>`).join("")}</tbody>`;

  const firstWall = Math.min(smoothYears, vramYears);
  const wallIsVram = vramYears < smoothYears;
  document.getElementById("summary").innerHTML = `
    <b>Summary.</b> At ${S.resolution} ${QUALITY[S.quality].label}${S.rt !== "off" ? " with " + RT_LEVELS[S.rt].label : ""},
    this system delivers <b>${now.fps} FPS</b> in a representative ${S.demand} AAA title today.
    As new releases get heavier, it stays above 60 FPS for about <b>${smoothYears} year${smoothYears === 1 ? "" : "s"}</b>
    and above 30 FPS for about <b>${usableYears}</b>.
    <br><br><b>The first wall is ${wallIsVram ? "VRAM, not speed" : "raw speed"}.</b>
    ${wallIsVram
      ? `Around ${2025 + vramYears} new titles will need more than the ${gpu.vram} GB on your ${gpu.name}. ` +
        `That is the failure mode people miss: the average frame rate looks acceptable, but memory spill causes the stutter that averages hide. ` +
        `When it happens, dropping texture quality one notch recovers most of it — a GPU upgrade is the only real fix.`
      : `Performance, not memory, is what will date this machine. ${gpu.vram} GB of ${gpu.vramType} will still be enough when the frame rate is not.`}
    ${S.upscaling === "off"
      ? `<br><br><b>Cheapest way to extend its life:</b> you are not using ${upscalerName(gpu)}. Turning it on at Quality would add roughly ${Math.round((upscalerMultiplier(gpu, "quality") - 1) * 100)}% frames today and push the 60 FPS wall out by several years.`
      : `<br><br>You are already using ${upscalerName(gpu)} ${S.upscaling}, which has bought this system roughly ${Math.round((upscalerMultiplier(gpu, S.upscaling) - 1) * 100)}% extra frames. When that runs out, ${gpu.fg ? "frame generation is the last reserve" : "there is no frame generation on this generation, so an upgrade is the only lever left"}.`}
    <br><br><b>Hardware reliability</b> is a separate clock: capacitors and PSU age out around 7–10 years, GPU fans around 5–7. Expect the performance wall long before the parts fail.`;
}

["cpu", "gpu", "resolution", "quality", "rt", "demand", "upscaling"].forEach(id =>
  on(id, "change", () => { S[id] = val(id); forecast(); }));
on("ramAmount", "change", () => { S.ramGb = num("ramAmount", 32); forecast(); });
on("run", "click", () => { forecast(); toast("Lifespan forecast"); });

forecast();
</script>
</body>
</html>
