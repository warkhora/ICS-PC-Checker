<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPU &amp; GPU Comparison — PCFORGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>

<div class="pf-container">

  <header class="pf-hero">
    <div class="pf-eyebrow">● <span id="dbCount"></span> real components</div>
    <h1>Hardware Comparison</h1>
    <p>Put up to three CPUs or GPUs side by side — full spec sheets plus a normalised
       performance bar so you can see the gap at a glance. Every entry is a real,
       purchasable part.</p>
  </header>

  <section class="pf-card pf-card-hover reveal">
    <h2><span class="ico">⚖</span> Pick your parts</h2>
    <div class="pf-grid pf-grid-2" style="margin-bottom:14px;">
      <div>
        <label class="pf-label" for="kind">Compare</label>
        <select id="kind">
          <option value="cpu">Processors</option>
          <option value="gpu">Graphics cards</option>
        </select>
      </div>
      <div>
        <label class="pf-label" for="search">Filter by name, family or architecture</label>
        <input type="text" id="search" placeholder="e.g. 5070, Zen 5, Blackwell…">
      </div>
    </div>
    <div class="pf-grid pf-grid-3">
      <div><label class="pf-label" for="p1">Slot 1</label><select id="p1"></select></div>
      <div><label class="pf-label" for="p2">Slot 2</label><select id="p2"></select></div>
      <div><label class="pf-label" for="p3">Slot 3 (optional)</label><select id="p3"></select></div>
    </div>
    <button class="pf-btn" id="compare">Compare</button>
  </section>

  <section class="pf-card reveal" id="resultCard">
    <h2><span class="ico">📊</span> Performance at a glance</h2>
    <div id="perfChart"></div>
    <div class="pf-note" id="perfNote"></div>
    <div class="pf-section-title">Full specification</div>
    <div class="pf-scroll"><table class="pf-table" id="result"></table></div>
  </section>

</div>

<script src="assets/data.js"></script>
<script src="assets/engine.js"></script>
<script>
const kind = document.getElementById("kind");
const search = document.getElementById("search");
const slots = ["p1", "p2", "p3"].map(id => document.getElementById(id));
let currentList = [];

function metric(item) {
  return kind.value === "cpu" ? item.gaming : item.index;
}
function metricLabel() {
  return kind.value === "cpu" ? "Gaming throughput (9800X3D = 100)" : "Raster performance (RTX 4070 = 100)";
}

function refreshOptions() {
  const q = search.value.trim().toLowerCase();
  const all = kind.value === "cpu" ? CPUS : GPUS;
  currentList = all.filter(it => !q ||
    (it.name + " " + it.family + " " + it.arch + " " + it.segment).toLowerCase().includes(q));

  const labelFn = kind.value === "cpu"
    ? c => `${c.name} — ${c.cores}C/${c.threads}T`
    : g => `${g.name} — ${g.vram} GB`;

  const chosen = slots.map(s => s.value);
  slots.forEach((sel, i) => {
    fillSelect(sel, [{ id: "", name: "— empty slot —" }, ...currentList], { labelFn });
    if (chosen[i] && [...sel.options].some(o => o.value === chosen[i])) sel.value = chosen[i];
    else sel.value = "";
  });

  // sensible defaults so the page is never empty
  if (!slots.some(s => s.value)) {
    const defaults = kind.value === "cpu"
      ? ["9800x3d", "14900k", "7800x3d"]
      : ["rtx5070", "rtx4070s", "rx9070"];
    defaults.forEach((d, i) => { if (slots[i]) slots[i].value = d; });
  }
}

function compare() {
  const picked = slots.map(s => s.value).filter(Boolean).map(id =>
    (kind.value === "cpu" ? cpuById(id) : gpuById(id)));

  if (!picked.length) { toast("Pick at least one part"); return; }

  /* ---- performance bars ---- */
  const vals = picked.map(metric);
  const best = Math.max(...vals);
  document.getElementById("perfChart").innerHTML =
    sparkline(vals, picked.map(p => p.name.replace(/^(NVIDIA GeForce|AMD Radeon|AMD|Intel|Apple) /, "")), vals.indexOf(best));
  mountCharts(document.getElementById("perfChart"));

  const spread = picked.length > 1
    ? Math.round((best / Math.min(...vals) - 1) * 100) : 0;
  const winner = picked[vals.indexOf(best)];
  document.getElementById("perfNote").innerHTML =
    `<b>${winner.name}</b> leads on ${metricLabel().split(" (")[0].toLowerCase()}.` +
    (picked.length > 1 ? ` The gap to the slowest of the three is <b>${spread}%</b>.` : "");

  /* ---- spec table ---- */
  const isCpu = kind.value === "cpu";
  const col = fn => picked.map(p => `<td>${fn(p) ?? "—"}</td>`).join("");

  const rows = isCpu ? [
    ["Family",        c => c.family],
    ["Segment",       c => c.segment],
    ["Cores / Threads", c => `${c.cores}C / ${c.threads}T`],
    ["Base clock",    c => c.base],
    ["Boost clock",   c => c.boost],
    ["Cache",         c => c.cache],
    ["Architecture",  c => c.arch],
    ["Socket",        c => c.socket],
    ["TDP / PPT",     c => `${c.tdp} W / ${c.ppt} W`],
    ["Memory",        c => c.mem],
    ["PCIe",          c => c.pcie],
    ["NPU",           c => c.npu],
    ["Released",      c => c.released],
    ["Gaming score",  c => `<b class="c-gold">${c.gaming}</b>`],
    ["Multi-thread",  c => `<b class="c-cyan">${c.mt}</b> <small>(9950X = 100)</small>`],
    ["Launch price",  c => c.price ? "$" + fmt(c.price) : "—"]
  ] : [
    ["Family",        g => g.family],
    ["Segment",       g => g.segment],
    ["Architecture",  g => g.arch],
    ["Shaders",       g => g.cores],
    ["Boost clock",   g => g.boost],
    ["Memory",        g => `${g.vram} GB ${g.vramType}`],
    ["Bus",           g => g.bus],
    ["Bandwidth",     g => fmt(g.bw) + " GB/s"],
    ["TGP",           g => g.tdp + " W"],
    ["Interface",     g => g.pcie],
    ["Typical length",g => g.length + " mm"],
    ["Upscaler",      g => upscalerName(g)],
    ["Frame generation", g => g.fg ? `Up to ${g.fg}×` : "No"],
    ["Ray tracing",   g => g.noRT ? '<b class="c-red">No RT hardware</b>' : `Yes (loss factor ×${g.rtFac})`],
    ["Released",      g => g.released],
    ["Raster score",  g => `<b class="c-gold">${g.index}</b>`],
    ["Launch price",  g => g.price ? "$" + fmt(g.price) : "—"],
    ["Verdict",       g => g.perf]
  ];

  document.getElementById("result").innerHTML = `
    <thead><tr><th></th>${picked.map(p =>
      `<th>${p.name}<br><span class="pf-chip gold" style="margin-top:6px;">${p.family}</span></th>`).join("")}</tr></thead>
    <tbody>${rows.map(([label, fn]) =>
      `<tr><td class="spec-label">${label}</td>${col(fn)}</tr>`).join("")}</tbody>`;
}

kind.addEventListener("change", () => { refreshOptions(); compare(); });
search.addEventListener("input", refreshOptions);
document.getElementById("compare").addEventListener("click", compare);
slots.forEach(s => s.addEventListener("change", compare));

document.getElementById("dbCount").textContent = CPUS.length + GPUS.length;
refreshOptions();
compare();
</script>
</body>
</html>
