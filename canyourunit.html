<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Can You Run It? — PCFORGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>

<div class="pf-container">

  <header class="pf-hero">
    <div class="pf-eyebrow">● Requirement check</div>
    <h1>Can You Run It?</h1>
    <p>A straight yes-or-no against the minimum and recommended requirements for
       <span id="gameName" class="c-gold"></span> — CPU, GPU, VRAM, system RAM and storage.
       No frame-rate guessing here; use the FPS Estimator for that.</p>
  </header>

  <section class="pf-card pf-card-hover reveal">
    <h2><span class="ico">🖥</span> Your hardware</h2>
    <div class="pf-grid pf-grid-2">
      <div><label class="pf-label" for="cpu">CPU</label><select id="cpu"></select></div>
      <div><label class="pf-label" for="gpu">GPU</label><select id="gpu"></select></div>
    </div>
    <div class="pf-grid pf-grid-3" style="margin-top:14px;">
      <div><label class="pf-label" for="ramAmount">System RAM</label><select id="ramAmount"></select></div>
      <div><label class="pf-label" for="storageType">Game installed on</label><select id="storageType"></select></div>
      <div><label class="pf-label" for="game">Game</label><select id="game"></select></div>
    </div>
    <button class="pf-btn" id="run">Check requirements</button>
  </section>

  <section class="pf-card reveal">
    <h2><span class="ico">📋</span> Result</h2>
    <div class="pf-hero-fps">
      <div class="num" id="verdictNum">—</div>
      <div class="unit" id="verdictUnit">—</div>
      <div class="pf-verdict" id="verdict"></div>
    </div>
    <div class="pf-section-title">Requirement breakdown</div>
    <div class="pf-scroll"><table class="pf-table" id="table"></table></div>
    <div class="pf-section-title">What to expect in-game</div>
    <div class="pf-grid pf-grid-3" id="perf"></div>
    <div class="pf-summary" id="summary"></div>
  </section>

</div>

<script src="assets/data.js"></script>
<script src="assets/engine.js"></script>
<script>
const S = { cpu: "9600x", gpu: "rtx4060", game: "fh6", ramGb: 16, storage: "nvme4" };

fillSelect(document.getElementById("cpu"), CPUS.filter(c => !c.integrated), { groupKey: "brand", value: S.cpu });
fillSelect(document.getElementById("gpu"), GPUS, { groupKey: "brand", value: S.gpu, labelFn: g => `${g.name} — ${g.vram} GB` });
fillSelect(document.getElementById("game"), GAMES, { groupKey: "genre", value: S.game });
fillSelect(document.getElementById("ramAmount"), RAM_AMOUNTS.map(a => ({ id: a, name: a + " GB" })), { value: 16 });
fillEnumSelect(document.getElementById("storageType"), STORAGE_TYPES, S.storage);

function run() {
  const cpu = cpuById(S.cpu), gpu = gpuById(S.gpu), game = gameById(S.game);
  document.getElementById("gameName").textContent = game.name;

  const block = canRunGame(gpu, game);
  const rows = [];
  const add = (label, yours, min, rec, ok, note) => rows.push({ label, yours, min, rec, ok, note });

  /* CPU */
  const cpuMin = cpu.gaming >= game.minCpu, cpuRec = cpu.gaming >= game.recCpu;
  add("CPU", `${cpu.name}<br><span class="pf-mono c-dim">gaming index ${cpu.gaming}</span>`,
      `index ${game.minCpu}`, `index ${game.recCpu}`,
      cpuMin ? (cpuRec ? "pass" : "warn") : "fail",
      cpuRec ? "Above recommended." : cpuMin ? "Meets the minimum but not the recommended." : "Below the minimum — expect severe stutter and long stalls.");

  /* GPU */
  const gpuMin = gpu.index >= game.minGpu, gpuRec = gpu.index >= game.recGpu;
  add("GPU", `${gpu.name}<br><span class="pf-mono c-dim">raster index ${gpu.index}</span>`,
      `index ${game.minGpu}`, `index ${game.recGpu}`,
      gpuMin ? (gpuRec ? "pass" : "warn") : "fail",
      gpuRec ? "Above recommended." : gpuMin ? "Meets the minimum but not the recommended." : "Below the minimum.");

  /* VRAM */
  const needed = vramRequired(game, "1440p", "high", "off", "off");
  const vramOk = gpu.vram >= needed * 0.9;
  add("VRAM", `${gpu.vram} GB ${gpu.vramType}`,
      `${(needed * 0.7).toFixed(1)} GB (1080p)`, `${needed.toFixed(1)} GB (1440p high)`,
      gpu.vram >= needed ? "pass" : vramOk ? "warn" : "fail",
      gpu.vram >= needed ? "Enough for 1440p High without spilling."
        : vramOk ? "Tight — fine at 1080p, will spill at 1440p High."
        : "Not enough. Expect texture pop-in and stutter at 1440p.");

  /* RAM */
  const ramOk = S.ramGb >= game.minRam, ramRec = S.ramGb >= game.recRam;
  add("System RAM", `${S.ramGb} GB`, `${game.minRam} GB`, `${game.recRam} GB`,
      ramOk ? (ramRec ? "pass" : "warn") : "fail",
      ramRec ? "Comfortable." : ramOk ? "Meets the minimum; close background apps." : "Below minimum — the game may not launch.");

  /* Storage */
  const st = STORAGE_TYPES[S.storage];
  const needsSSD = game.storage === "ssd";
  add("Storage", st.label, needsSSD ? "SSD required" : "HDD acceptable", "NVMe recommended",
      needsSSD && S.storage === "hdd" ? "fail" : S.storage === "hdd" || S.storage === "sata" ? "warn" : "pass",
      needsSSD && S.storage === "hdd" ? "This title requires an SSD; on a hard drive it streams too slowly to be playable."
        : S.storage === "hdd" ? "It will run, but load times and streaming will suffer."
        : `${fmt(st.mbps)} MB/s sequential — fine for this game.`);

  /* Install size */
  add("Install size", "—", `${game.sizeGB} GB free`, `${game.sizeGB + 20} GB free`,
      "pass", "Make sure the drive has room for patches too.");

  /* RT capability */
  if (gameSupportsRT(game)) {
    add("Ray tracing", isRT(gpu) ? "Supported" : "No RT hardware", "Optional", "Optional",
        isRT(gpu) ? "pass" : "warn",
        isRT(gpu) ? `${game.name} supports ray tracing and so does your card.`
                  : `Your card has no RT hardware, so ray tracing is unavailable in ${game.name}.`);
  }
  if (gameSupportsPT(game)) {
    add("Path tracing", isRT(gpu) ? game.pt.name : "Unavailable", "Optional", "Optional",
        isRT(gpu) ? (gpu.vram >= 16 ? "pass" : "warn") : "fail",
        isRT(gpu) ? (gpu.vram >= 16 ? "Your VRAM is large enough to attempt it." : "Works, but path tracing needs a lot of VRAM — expect spill on a " + gpu.vram + " GB card.")
                  : "Path tracing requires RT hardware.");
  }

  /* hard blocks */
  if (!block.ok) rows.unshift({ label: "Launch", yours: gpu.name, min: "—", rec: "—", ok: "fail", note: block.reason });

  const fails = rows.filter(r => r.ok === "fail").length;
  const warns = rows.filter(r => r.ok === "warn").length;

  const num = document.getElementById("verdictNum");
  const unit = document.getElementById("verdictUnit");
  const v = document.getElementById("verdict");

  if (fails) {
    num.className = "num c-red glow-red"; num.textContent = "NO";
    unit.textContent = "does not meet the minimum requirements";
    v.className = "pf-verdict c-red"; v.textContent = `${fails} requirement${fails > 1 ? "s" : ""} not met`;
  } else if (warns >= 2) {
    num.className = "num c-orange glow-orange"; num.textContent = "YES";
    unit.textContent = "but only on reduced settings";
    v.className = "pf-verdict c-orange"; v.textContent = `${warns} areas below recommended`;
  } else {
    num.className = "num c-green glow-green"; num.textContent = "YES";
    unit.textContent = "comfortably, at high or ultra settings";
    v.className = "pf-verdict c-green"; v.textContent = "all requirements met";
  }

  document.getElementById("table").innerHTML = `
    <thead><tr><th>Requirement</th><th>You have</th><th>Minimum</th><th>Recommended</th><th>Status</th></tr></thead>
    <tbody>${rows.map(r => `
      <tr>
        <td class="spec-label">${r.label}</td>
        <td>${r.yours}</td>
        <td class="c-dim">${r.min}</td>
        <td class="c-dim">${r.rec}</td>
        <td><span class="pf-chip ${r.ok === "pass" ? "green" : r.ok === "warn" ? "orange" : "red"}">${r.ok === "pass" ? "OK" : r.ok === "warn" ? "MARGINAL" : "FAIL"}</span>
          <div class="pf-stat-note">${r.note}</div></td>
      </tr>`).join("")}</tbody>`;

  /* what to expect */
  const e1080 = estimate({ cpu: S.cpu, gpu: S.gpu, game: S.game, resolution: "1080p", quality: "high", rt: "off", ramGb: S.ramGb, ramSpeed: "ddr5-6000" });
  const e1440 = estimate({ cpu: S.cpu, gpu: S.gpu, game: S.game, resolution: "1440p", quality: "ultra", rt: "off", ramGb: S.ramGb, ramSpeed: "ddr5-6000" });
  const e1440rt = estimate({ cpu: S.cpu, gpu: S.gpu, game: S.game, resolution: "1440p", quality: "ultra", rt: gameSupportsRT(game) ? "high" : "off", ramGb: S.ramGb, ramSpeed: "ddr5-6000" });
  const cell = (r, title) => r.blocked ? "" : `
    <div class="pf-stat">
      <div class="pf-stat-label">${title}</div>
      <div class="pf-stat-value ${fpsClass(r.fps).cls}">${r.fps}<small> fps</small></div>
      <div class="pf-stat-note">${r.vram.state === "over" ? `<span class="c-red">VRAM spilling ${r.vram.overflow.toFixed(1)} GB</span>` : r.vram.required.toFixed(1) + " GB VRAM"}</div>
    </div>`;
  document.getElementById("perf").innerHTML =
    cell(e1080, "1080p High") + cell(e1440, "1440p Ultra") + cell(e1440rt, gameSupportsRT(game) ? "1440p Ultra + RT High" : "4K High");
  if (!e1440.blocked) {
    document.getElementById("perf").querySelectorAll(".pf-stat-value").forEach((el, i) => {
      const vals = [e1080, e1440, e1440rt];
      if (vals[i]) animateNumber(el, vals[i].fps, { suffix: "" });
    });
  }

  document.getElementById("summary").innerHTML = fails
    ? `<b>You cannot run ${game.name} properly on this system.</b> ${rows.filter(r => r.ok === "fail").map(r => r.note).join(" ")}`
    : warns
      ? `<b>${game.name} will run.</b> You are below the recommended spec in ${warns} area(s): ${rows.filter(r => r.ok === "warn").map(r => r.label).join(", ")}. Expect to trade settings for smoothness — the <a class="c-gold" href="optimizer.html">Settings Optimizer</a> will find the best combination for you.`
      : `<b>You are comfortably above the requirements for ${game.name}.</b> Nothing here will hold you back. ${game.notes} <a class="c-gold" href="fps.html">Estimate your frame rate →</a>`;
}

["cpu", "gpu", "game"].forEach(id => on(id, "change", () => { S[id] = val(id); run(); }));
on("ramAmount", "change", () => { S.ramGb = num("ramAmount", 16); run(); });
on("storageType", "change", () => { S.storage = val("storageType"); run(); });
on("run", "click", () => { run(); toast("Requirements checked"); });

run();
</script>
</body>
</html>
