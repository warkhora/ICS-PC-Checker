<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thermal &amp; Cooling Simulator — PCFORGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>

<div class="pf-container">

  <header class="pf-hero">
    <div class="pf-eyebrow">● Heat &amp; noise</div>
    <h1>Thermal &amp; Cooling</h1>
    <p>How hot does it actually get, will it throttle, and how loud will the room be?
       CPU heat, GPU core, memory junction and case airflow all feed into one model.</p>
  </header>

  <section class="pf-card pf-card-hover reveal">
    <h2><span class="ico">🌡</span> Cooling setup</h2>
    <div class="pf-grid pf-grid-2">
      <div><label class="pf-label" for="cpu">CPU</label><select id="cpu"></select></div>
      <div><label class="pf-label" for="gpu">GPU</label><select id="gpu"></select></div>
    </div>
    <div class="pf-grid pf-grid-2" style="margin-top:14px;">
      <div><label class="pf-label" for="cooler">CPU cooler</label><select id="cooler"></select></div>
      <div><label class="pf-label" for="airflow">Case airflow</label>
        <select id="airflow">
          <option value="high">High — mesh front, 6+ fans</option>
          <option value="balanced" selected>Balanced — solid front, 3–4 fans</option>
          <option value="weak">Weak — sealed front, 1–2 fans</option>
        </select>
      </div>
    </div>
    <div class="pf-grid pf-grid-3" style="margin-top:14px;">
      <div><label class="pf-label" for="ambient">Room temperature (°C)</label><input type="number" id="ambient" value="22" min="10" max="45"></div>
      <div><label class="pf-label" for="intensity">Workload</label>
        <select id="intensity">
          <option value="gaming" selected>Gaming</option>
          <option value="cpuheavy">CPU-heavy (render / compile)</option>
          <option value="gpuheavy">GPU-heavy (path tracing, ML)</option>
        </select>
      </div>
      <div><label class="pf-label" for="oc">Overclock / undervolt</label>
        <select id="oc">
          <option value="uv">Undervolted (−10% power)</option>
          <option value="stock" selected>Stock</option>
          <option value="oc">Overclocked (+15% power)</option>
        </select>
      </div>
    </div>
    <button class="pf-btn" id="run">Simulate thermals</button>
  </section>

  <section class="pf-card reveal">
    <h2><span class="ico">📊</span> Results</h2>
    <div class="pf-grid pf-grid-2" id="temps"></div>
    <div class="pf-section-title">Detail</div>
    <div class="pf-scroll"><table class="pf-table" id="table"></table></div>
    <div class="pf-summary" id="summary"></div>
  </section>

</div>

<script src="assets/data.js"></script>
<script src="assets/engine.js"></script>
<script>
const S = { cpu: "9800x3d", gpu: "rtx5070", cooler: 2, airflow: "balanced", ambient: 22, intensity: "gaming", oc: "stock" };

fillSelect(document.getElementById("cpu"), CPUS.filter(c => !c.integrated), { groupKey: "brand", value: S.cpu });
fillSelect(document.getElementById("gpu"), GPUS, { groupKey: "brand", value: S.gpu, labelFn: g => `${g.name} — ${g.tdp} W` });
fillSelect(document.getElementById("cooler"), COOLERS.map((c, i) => ({ id: i, name: `${c.name} — rated ${c.tdp} W` })), { value: 2 });

const AIRFLOW = { high: 0.87, balanced: 1.0, weak: 1.18 };
const OC = { uv: 0.90, stock: 1.0, oc: 1.15 };
const TJMAX = { AMD: 95, Intel: 100 };

function tempTone(t, limit) {
  if (t >= limit - 3) return "red";
  if (t >= limit - 15) return "";
  return "green";
}

function simulate() {
  const cpu = cpuById(S.cpu), gpu = gpuById(S.gpu), cooler = COOLERS[S.cooler];
  const air = AIRFLOW[S.airflow], oc = OC[S.oc], amb = S.ambient;

  /* --- how hard is each part working? --- */
  const load = {
    gaming:   { cpu: 0.55, gpu: 0.95 },
    cpuheavy: { cpu: 1.00, gpu: 0.15 },
    gpuheavy: { cpu: 0.35, gpu: 1.00 }
  }[S.intensity];

  const cpuW = Math.round(cpu.ppt * load.cpu * oc);
  const gpuW = Math.round(gpu.tdp * load.gpu * oc);

  /* --- CPU: delta-T scales with the fraction of the cooler's rating --- */
  const ratio = cpuW / Math.max(cooler.tdp, 1);
  const cpuDelta = 85 * Math.pow(ratio, 0.85) * air + (cooler.type === "aio" ? -3 : 0);
  const cpuTemp = Math.round(amb + cpuDelta);
  const cpuLimit = TJMAX[cpu.brand] || 95;
  const throttles = cpuTemp >= cpuLimit - 2;
  const headroom = cpuLimit - cpuTemp;

  /* --- GPU: modern cards target ~83 °C core, ~95–105 °C hotspot --- */
  const gpuDelta = (28 + gpu.tdp * 0.062) * air * (load.gpu * 0.7 + 0.3);
  const gpuTemp = Math.round(amb + gpuDelta);
  const hotspot = Math.round(gpuTemp + 16);
  const memTemp = Math.round(gpuTemp + (gpu.vramType === "GDDR7" || gpu.vramType === "GDDR6X" ? 22 : 14));
  const gpuThrottles = gpuTemp >= 84 || memTemp >= 105;

  /* --- noise --- */
  const fanRpm = clamp(0.35 + ratio * 0.65 + (S.airflow === "weak" ? 0.15 : 0), 0, 1.4);
  const noise = Math.round(cooler.noise + fanRpm * 8 + (cooler.type === "aio" ? 2 : 0));

  const rows = [
    ["CPU package", `${cpuTemp} °C`, `Limit ${cpuLimit} °C`, `${headroom} °C of headroom`, tempTone(cpuTemp, cpuLimit)],
    ["CPU power draw", `${cpuW} W`, `PPT ${cpu.ppt} W`, `${Math.round(cpuW / cpu.ppt * 100)}% of the package power limit`, "green"],
    ["Cooler load", `${Math.round(ratio * 100)}%`, `Rated ${cooler.tdp} W`, ratio > 1 ? "Over the cooler's rating — it cannot keep up" : "Within the cooler's rating", ratio > 0.95 ? "red" : ratio > 0.75 ? "" : "green"],
    ["GPU core", `${gpuTemp} °C`, "Target 83 °C", gpuTemp >= 83 ? "At the thermal target — clocks will back off" : "Comfortable", gpuTemp >= 83 ? "" : "green"],
    ["GPU hotspot", `${hotspot} °C`, "Limit 105 °C", hotspot >= 105 ? "Hotspot limit reached — expect throttling" : "Normal", hotspot >= 100 ? "red" : hotspot >= 92 ? "" : "green"],
    ["GPU memory junction", `${memTemp} °C`, "Limit 105 °C", memTemp >= 105 ? "Memory throttling — this silently caps frame rate" : "Normal", memTemp >= 100 ? "red" : memTemp >= 92 ? "" : "green"],
    ["GPU power draw", `${gpuW} W`, `TGP ${gpu.tdp} W`, `${Math.round(gpuW / gpu.tdp * 100)}% of the board power`, "green"],
    ["System noise", `≈${noise} dB(A)`, "—", noise > 45 ? "Clearly audible through a closed case" : noise > 36 ? "Audible but unobtrusive" : "Quiet", noise > 45 ? "red" : noise > 36 ? "" : "green"],
    ["Case airflow", S.airflow, "—", S.airflow === "weak" ? "A sealed front panel adds roughly 15% to every delta-T" : S.airflow === "high" ? "Mesh front keeps intake air cool" : "Typical mid-tower behaviour", S.airflow === "weak" ? "red" : "green"]
  ];

  document.getElementById("temps").innerHTML = `
    <div class="pf-stat">
      <div class="pf-stat-label">CPU package temperature</div>
      <div class="pf-stat-value ${cpuTemp >= cpuLimit - 3 ? "c-red" : cpuTemp >= cpuLimit - 15 ? "c-orange" : "c-green"}">${cpuTemp}<small> °C</small></div>
      <div class="pf-bar ${tempTone(cpuTemp, cpuLimit) === "red" ? "red" : tempTone(cpuTemp, cpuLimit) === "green" ? "green" : ""}"><i style="width:${clamp(cpuTemp / cpuLimit * 100, 0, 100)}%"></i></div>
      <div class="pf-stat-note">${throttles ? `<b class="c-red">Throttling.</b> The CPU is at its ${cpuLimit} °C limit and will drop clocks.` : `${headroom} °C below the ${cpuLimit} °C limit — no throttling.`}</div>
    </div>
    <div class="pf-stat">
      <div class="pf-stat-label">GPU core temperature</div>
      <div class="pf-stat-value ${gpuTemp >= 83 ? "c-orange" : gpuTemp >= 75 ? "c-gold" : "c-green"}">${gpuTemp}<small> °C</small></div>
      <div class="pf-bar ${gpuTemp >= 83 ? "red" : gpuTemp >= 75 ? "" : "green"}"><i style="width:${clamp(gpuTemp / 95 * 100, 0, 100)}%"></i></div>
      <div class="pf-stat-note">Hotspot ${hotspot} °C · memory junction ${memTemp} °C${gpuThrottles ? " — <b class='c-red'>throttling</b>" : ""}</div>
    </div>`;

  document.getElementById("table").innerHTML = `
    <thead><tr><th>Metric</th><th>Value</th><th>Limit / rated</th><th>Assessment</th></tr></thead>
    <tbody>${rows.map(([a, b, c, d, tone]) => `<tr>
      <td class="spec-label">${a}</td>
      <td><b class="${tone === "red" ? "c-red" : tone === "green" ? "c-green" : ""}">${b}</b></td>
      <td class="c-dim">${c}</td><td>${d}</td></tr>`).join("")}</tbody>`;

  const fpsImpact = throttles ? 12 : headroom < 8 ? 5 : gpuThrottles ? 8 : 0;
  document.getElementById("summary").innerHTML = `
    <b>Bottom line.</b> At ${amb} °C ambient with ${S.airflow} airflow, the ${cpu.name} settles at <b>${cpuTemp} °C</b> on the
    ${cooler.name} and the ${gpu.name} at <b>${gpuTemp} °C</b> core / <b>${memTemp} °C</b> memory junction.
    ${throttles ? `<b class="c-red">The CPU is throttling</b> — you are losing roughly ${fpsImpact}% of the performance you paid for. A bigger cooler or an undervolt is the fix.`
      : gpuThrottles ? `<b class="c-orange">The GPU is hitting its thermal target</b>, which costs about ${fpsImpact}% in sustained play. More intake airflow helps more than a CPU cooler upgrade.`
      : `Nothing throttles. You have ${headroom} °C of CPU headroom, so there is room for a warmer room or a mild overclock.`}
    <br><br><b>Noise:</b> about ${noise} dB(A) — ${noise > 45 ? "loud enough to notice over game audio" : noise > 36 ? "audible in a quiet room" : "effectively silent at your desk"}.
    ${S.airflow === "weak" ? "A mesh front panel and two extra intake fans is the single cheapest improvement available to you: it typically removes 4–6 °C from both CPU and GPU." : ""}
    ${ratio > 0.9 && !throttles ? "Your cooler is already near its rated limit — the next CPU you buy will need a bigger one." : ""}`;
}

["cpu", "gpu", "airflow", "intensity", "oc"].forEach(id => on(id, "change", () => { S[id] = val(id); simulate(); }));
on("cooler", "change", () => { S.cooler = num("cooler", 2); simulate(); });
on("ambient", "input", () => { S.ambient = num("ambient", 22); simulate(); });
on("run", "click", () => { simulate(); toast("Thermals simulated"); });

simulate();
</script>
</body>
</html>
